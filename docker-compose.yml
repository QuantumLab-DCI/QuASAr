services:
  backend:
    platform: linux/amd64
    build:
      context: ./Backend
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      FLASK_RELOAD: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Backend:/app
      - backend_venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./Frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_venv:
  frontend_node_modules:
